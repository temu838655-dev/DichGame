name: Smoke test (máy giả lập)

# Chạy app trên máy giả lập Android 14, mở từng màn hình, chụp ảnh và tìm lỗi crash.
# Ảnh chụp được đẩy lên nhánh ci-shots và lưu trong Artifacts (smoke-shots).
on:
  workflow_dispatch:
  push:
    branches: [main, master, fix/translation-pipeline]
    paths: ["app/**", "ci/**", ".github/workflows/smoke-test.yml", "*.kts", "gradle.properties"]

permissions:
  contents: write

concurrency:
  group: smoke-${{ github.ref }}
  # Emulator builds are expensive; do not cancel an in-flight smoke run when another commit arrives.
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build bản debug
        run: gradle :app:assembleDebug -PnoNative --no-daemon --stacktrace

      - name: Bật KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cài và kiểm tra ảnh hệ thống Android (thử lại nếu tải lỗi)
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            sdkmanager="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          if [ -z "$sdkmanager" ] || [ ! -x "$sdkmanager" ]; then
            echo "::error::Không tìm thấy sdkmanager trong $sdk_root"
            exit 1
          fi
          echo "SDK manager: $sdkmanager"
          package="system-images;android-34;google_apis;x86_64"
          image="$sdk_root/system-images/android-34/google_apis/x86_64/system.img"
          for attempt in 1 2 3; do
            if "$sdkmanager" --sdk_root="$sdk_root" --install "$package" && test -s "$image"; then
              exit 0
            fi
            "$sdkmanager" --sdk_root="$sdk_root" --uninstall "$package" || true
            sleep 10
          done
          echo "::error::Không tải được ảnh hệ thống Android sau 3 lần."
          exit 1

      - name: Chạy trên máy giả lập
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash ci/smoke.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-shots
          path: shots
          if-no-files-found: warn

      - name: Đẩy ảnh lên nhánh ci-shots
        if: always() && github.ref != 'refs/heads/fix/translation-pipeline'
        run: |
          if [ ! -d shots ] || [ -z "$(find shots -type f -print -quit)" ]; then
            echo "Không có ảnh kiểm thử để đẩy."
            exit 0
          fi
          cd shots
          git init -q
          git checkout -q -b ci-shots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Ảnh chụp từ máy giả lập, commit $GITHUB_SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-shots

      - name: Báo lỗi nếu app bị crash
        run: |
          if [ -s shots/crash.txt ]; then
            echo "App bị crash:"; cat shots/crash.txt; exit 1
          fi
          if [ -s shots/selftest-fail.txt ]; then
            echo "Giọng offline lỗi:"; cat shots/selftest.txt; exit 1
          fi
          if [ -s shots/ocr-fail.txt ]; then
            echo "Dịch video web bằng OCR lỗi:"; cat shots/ocr-fail.txt; cat shots/ocr-web.txt; echo ---; cat shots/ocr-web-full.txt; exit 1
          fi
          if [ -s shots/live-fail.txt ]; then
            echo "Dịch phụ đề trong màn chơi lỗi:"; cat shots/live-fail.txt; cat shots/live.txt; exit 1
          fi
          for f in narrate adjust settings tools toolsp pills uionce; do
            if [ -s shots/$f-fail.txt ]; then
              echo "Lỗi ở bước $f:"; cat shots/$f-fail.txt; exit 1
            fi
          done
          if [ -s shots/quality-fail.txt ]; then
            echo "Bảng chất lượng hình bị lỗi:"; cat shots/quality-fail.txt; exit 1
          fi
          if [ -s shots/uitr-live-fail.txt ]; then
            echo "Dịch chữ giao diện (đọc thật trên máy giả lập) lỗi:"; cat shots/uitr-live-fail.txt; cat shots/uitr-live.txt; exit 1
          fi
          if [ -s shots/play-fail.txt ]; then
            echo "Màn chơi (xem thử) bị lỗi:"; cat shots/play-fail.txt; exit 1
          fi
          if [ -s shots/spin-fail.txt ]; then
            echo "Xoay màn hình trong màn chơi bị lỗi:"; cat shots/spin-fail.txt; cat shots/spin.txt; exit 1
          fi
          if [ -s shots/uitr-fail.txt ]; then
            echo "Lớp phủ dịch giao diện bị lỗi:"; cat shots/uitr-fail.txt; cat shots/uitr.txt; exit 1
          fi
