name: Smoke test (máy giả lập)

# Chạy app trên máy giả lập Android 14, mở từng màn hình, chụp ảnh và tìm lỗi crash.
# Ảnh chụp được đẩy lên nhánh ci-shots và lưu trong Artifacts (smoke-shots).
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ["app/**", "ci/**", ".github/workflows/smoke-test.yml", "*.kts", "gradle.properties"]

permissions:
  contents: write

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build bản debug
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Bật KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Chạy trên máy giả lập
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash ci/smoke.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-shots
          path: shots
          if-no-files-found: warn

      - name: Đẩy ảnh lên nhánh ci-shots
        if: always()
        run: |
          cd shots
          git init -q
          git checkout -q -b ci-shots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Ảnh chụp từ máy giả lập, commit $GITHUB_SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-shots

      - name: Báo lỗi nếu app bị crash
        run: |
          if [ -s shots/crash.txt ]; then
            echo "App bị crash:"; cat shots/crash.txt; exit 1
          fi
