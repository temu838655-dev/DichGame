name: Build iOS Simulator and iPhone IPA
on:
  workflow_dispatch:
  push:
    branches: [main, "feat/ios-windows-native-starters"]
    paths: ["ios/**", ".github/workflows/build-ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/build-ios.yml"]
jobs:
  ios-simulator:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Print Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate native iOS project
        working-directory: ios
        run: xcodegen generate
      - name: Build iOS Simulator app (no signing required)
        working-directory: ios
        run: |
          xcodebuild \
            -project DichGameiOS.xcodeproj \
            -scheme DichGameiOS \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dichgame-ios" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Package simulator app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/dichgame-ios/Build/Products/Debug-iphonesimulator/DichGameiOS.app" \
            "$GITHUB_WORKSPACE/ios/DichGame-iOS-Simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: DichGame-iOS-Simulator
          path: ios/DichGame-iOS-Simulator.zip
          if-no-files-found: error

  ios-iphone-ipa-unsigned:
    name: Build iPhone IPA (unsigned, for signing)
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate native iOS project
        working-directory: ios
        run: xcodegen generate
      - name: Build actual iPhone architecture (arm64, unsigned)
        working-directory: ios
        run: |
          xcodebuild \
            -project DichGameiOS.xcodeproj \
            -scheme DichGameiOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dichgame-ios-device" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Package and verify unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/dichgame-ios-device/Build/Products/Release-iphoneos/DichGameiOS.app"
          test -f "$APP/Info.plist"
          test -f "$APP/DichGameiOS"
          /usr/bin/lipo -archs "$APP/DichGameiOS" | grep -qw arm64
          STAGING="$RUNNER_TEMP/dichgame-ipa-stage"
          mkdir -p "$STAGING/Payload" ios/dist
          /usr/bin/ditto "$APP" "$STAGING/Payload/DichGameiOS.app"
          (cd "$STAGING" && /usr/bin/zip -qry "$GITHUB_WORKSPACE/ios/dist/DichGame-iPhone-unsigned.ipa" Payload)
          /usr/bin/unzip -tq ios/dist/DichGame-iPhone-unsigned.ipa
          /usr/bin/unzip -Z1 ios/dist/DichGame-iPhone-unsigned.ipa | grep -qx "Payload/DichGameiOS.app/Info.plist"
          echo "::notice::IPA chỉ là gói iPhone arm64 chưa ký, KHÔNG cài trực tiếp lên iPhone thường."
      - uses: actions/upload-artifact@v4
        with:
          name: DichGame-iPhone-IPA-unsigned
          path: ios/dist/DichGame-iPhone-unsigned.ipa
          if-no-files-found: error
