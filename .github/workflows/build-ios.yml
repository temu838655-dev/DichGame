name: Build iOS Simulator (unsigned)
on:
  workflow_dispatch:
  push:
    branches: [main, "feat/ios-windows-native-starters"]
    paths: ["ios/**", ".github/workflows/build-ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/build-ios.yml"]
jobs:
  ios-simulator:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Print Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate native iOS project
        working-directory: ios
        run: xcodegen generate
      - name: Build iOS Simulator app (no signing required)
        working-directory: ios
        run: |
          xcodebuild \
            -project DichGameiOS.xcodeproj \
            -scheme DichGameiOS \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dichgame-ios" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Package simulator app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/dichgame-ios/Build/Products/Debug-iphonesimulator/DichGameiOS.app" \
            "$RUNNER_TEMP/DichGame-iOS-Simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: DichGame-iOS-Simulator
          path: /Users/runner/work/_temp/DichGame-iOS-Simulator.zip
          if-no-files-found: error
