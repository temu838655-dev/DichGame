name: Smoke test web OCR, CC and thuyết minh

on:
  pull_request:
    paths:
      - "app/src/main/java/com/dichgame/app/WebTranslateActivity.kt"
      - "app/src/main/java/com/dichgame/app/Ocr.kt"
      - "app/src/main/java/com/dichgame/app/SubtitleLanguageRouter.kt"
      - "ci/web-smoke.sh"
      - ".github/workflows/web-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK without native Remote Play
        run: gradle :app:assembleDebug -PnoNative --no-daemon --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run real WebView OCR / CC / TTS flow on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash ci/web-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-ocr-cc-smoke-results
          path: shots-web/
          if-no-files-found: warn
