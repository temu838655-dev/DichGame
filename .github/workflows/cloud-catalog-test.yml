name: Cloud catalog tests
on:
  pull_request:
    paths:
      - 'tools/**'
      - '.github/workflows/cloud-catalog-test.yml'
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - '.github/workflows/cloud-catalog-test.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools -p test_build_cloud_catalog.py
