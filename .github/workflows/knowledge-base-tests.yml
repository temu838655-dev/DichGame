name: Knowledge Base Tests

on:
  push:
    paths:
      - "knowledge_base/**"
      - ".github/workflows/knowledge-base-tests.yml"
  pull_request:
    paths:
      - "knowledge_base/**"
      - ".github/workflows/knowledge-base-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Excel importer dependency
        run: python -m pip install 'openpyxl>=3.1,<4'
      - name: Run knowledge base tests
        run: python -m unittest discover -s knowledge_base/tests -v
