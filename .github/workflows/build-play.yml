name: Build Google Play bundle
on:
  pull_request:
    paths: ["app/**", "*.kts", ".github/workflows/build-play.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: play-bundle-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build and test the Play edition
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          gradle :app:testDebugUnitTest :app:bundleRelease -PplayBuild -PbuildNo="$((1000000 + GITHUB_RUN_NUMBER))" --no-daemon --stacktrace
          test -s app/build/outputs/bundle/release/app-release.aab
          manifest=$(find app/build/intermediates/merged_manifests/release -name AndroidManifest.xml -print -quit)
          test -s "$manifest"
          if grep -qE 'REQUEST_INSTALL_PACKAGES|com.dichgame.update.UpdateReceiver' "$manifest"; then
            exit 1
          fi
          if unzip -Z1 app/build/outputs/bundle/release/app-release.aab | grep -E '(^|/)[^/]+\.apk$|/libchiaki[^/]*\.so$'; then
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: DichGame-Play-unsigned
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
