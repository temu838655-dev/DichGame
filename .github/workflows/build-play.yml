name: Build Google Play bundle
on:
  pull_request:
    paths: ["app/**", "*.kts", ".github/workflows/build-play.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: play-bundle-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      # Engine Remote Play (chiaki-ng) nằm trong third_party/chiaki-ng. Chỉ lấy đúng các thư viện con cần dùng, không lấy cả repo.
      - name: Lấy engine Remote Play (chiaki-ng)
        run: |
          git submodule update --init --depth 1 third_party/chiaki-ng
          cd third_party/chiaki-ng
          git submodule update --init --depth 1 third-party/nanopb third-party/jerasure third-party/gf-complete third-party/curl

      # Nối PCM đã giải mã từ Chiaki sang callback Kotlin để đưa vào hàng đợi ASR.
      - name: Áp dụng cầu nối âm thanh PCM cho Chiaki
        run: python3 tools/patch-chiaki-audio-pcm.py

      # Sửa lỗi treo cứng bộ giải mã hình khi surface bị huỷ (xoay màn hình, tắt màn hình).
      - name: Vá bộ giải mã hình của Chiaki (treo khi xoay màn hình)
        run: python3 tools/patch-chiaki-video-decoder.py

      # Công cụ để sinh mã giao thức (nanopb cần protoc và gói Python protobuf).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cài protoc và gói Python protobuf
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler
          python -m pip install "protobuf>=4,<6"
          protoc --version

      # Android NDK đôi lúc được SDK Manager tải thành tệp ZIP hỏng trên runner GitHub.
      # Chuẩn bị NDK trước khi chạy Gradle, thử lại thay vì làm hỏng cả bản phát hành.
      - name: Cài NDK Android (thử lại khi tải lỗi)
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          for attempt in 1 2 3; do
            if "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "ndk;28.2.13676358"; then
              if [ -f "$ANDROID_HOME/ndk/28.2.13676358/source.properties" ]; then
                echo "Android NDK 28.2 đã sẵn sàng."
                break
              fi
            fi
            echo "::warning::NDK tải lỗi (lần $attempt/3); đang thử lại."
            rm -rf "$ANDROID_HOME/ndk/28.2.13676358"
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Không tải được Android NDK sau 3 lần thử."
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Đóng gói LG receiver vào APK
        run: |
          npm install -g @webos-tools/cli
          bash webos/package-dev.sh
          mkdir -p app/src/main/assets/tv
          packages=(webos/dist/*.ipk)
          test "${#packages[@]}" -eq 1
          test -s "${packages[0]}"
          cp "${packages[0]}" app/src/main/assets/tv/dichgame-lg.ipk
          python3 samsung/export-project.py app/src/main/assets/tv/DichGame-Samsung-source.zip

      - name: Build and test the Play edition
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          gradle :app:testDebugUnitTest :app:bundleRelease -PplayBuild -PbuildNo="$((1000000 + GITHUB_RUN_NUMBER))" --no-daemon --stacktrace
          test -s app/build/outputs/bundle/release/app-release.aab
          manifest=$(find app/build/intermediates/merged_manifests/release -name AndroidManifest.xml -print -quit)
          test -s "$manifest"
          if grep -qE 'REQUEST_INSTALL_PACKAGES|com.dichgame.update.UpdateReceiver' "$manifest"; then
            exit 1
          fi
          unzip -Z1 app/build/outputs/bundle/release/app-release.aab > "$RUNNER_TEMP/play-entries.txt"
          for entry in base/lib/arm64-v8a/libchiaki-jni.so base/assets/tv/dichgame-lg.ipk base/assets/tv/DichGame-Samsung-source.zip; do
            grep -Fx "$entry" "$RUNNER_TEMP/play-entries.txt"
          done
          if grep -E '(^|/)[^/]+\.apk$' "$RUNNER_TEMP/play-entries.txt"; then
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: DichGame-Play-unsigned
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
