name: Deploy DichGame Cloudflare (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dichgame-cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/game-subtitles-toolbar-gemini'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test backend
        run: node --test backend/cloudflare/test.mjs
      - name: Provision D1, apply migrations and deploy
        working-directory: backend/cloudflare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ADMIN_TOKEN: ${{ secrets.DICHGAME_ADMIN_TOKEN }}
          CLIENT_TOKEN: ${{ secrets.DICHGAME_CLIENT_TOKEN }}
          CI: 'true'
          WRANGLER_SEND_METRICS: 'false'
        shell: bash
        run: |
          set -euo pipefail
          python3 deploy_config.py
          secret_file="$(mktemp)"
          trap 'rm -f "$secret_file"' EXIT
          chmod 600 "$secret_file"
          export SECRET_FILE="$secret_file"
          python3 -c 'import os,json; from pathlib import Path; Path(os.environ["SECRET_FILE"]).write_text(json.dumps({k:os.environ[k] for k in ("ADMIN_TOKEN","CLIENT_TOKEN")}))'
          npx --yes wrangler@4 d1 migrations apply DB --remote
          npx --yes wrangler@4 deploy --secrets-file "$secret_file"
          echo 'Cloudflare deploy completed. Copy the HTTPS Worker URL from the deployment output.' >> "$GITHUB_STEP_SUMMARY"
