name: Check TV web receivers
on:
  push:
    paths: ['samsung/**', 'webos/**', '.github/workflows/check-tv-web.yml']
  pull_request:
    paths: ['samsung/**', 'webos/**', '.github/workflows/check-tv-web.yml']
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check samsung/receiver.js
      - run: bash -n samsung/package-dev.sh
      - run: |
          python3 - <<'PY'
          import json, pathlib, re, xml.etree.ElementTree as ET
          ET.parse('samsung/config.xml')
          app = json.loads(pathlib.Path('webos/appinfo.json').read_text())
          assert pathlib.Path('webos', app['main']).is_file()
          script = re.search(r'<script>(.*?)</script>', pathlib.Path('webos/index.html').read_text(), re.S)
          assert script
          pathlib.Path('/tmp/webos-receiver.js').write_text(script.group(1))
          PY
          node --check /tmp/webos-receiver.js
