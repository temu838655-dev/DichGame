name: Check TV web receivers
on:
  push:
    paths: ['samsung/**', 'webos/**', 'tests/tv-pairing.test.js', '.github/workflows/check-tv-web.yml']
  pull_request:
    paths: ['samsung/**', 'webos/**', 'tests/tv-pairing.test.js', '.github/workflows/check-tv-web.yml']
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          node --check samsung/receiver.js
          node --check samsung/pairing.js
          node --check webos/pairing.js
          cmp samsung/pairing.js webos/pairing.js
          node tests/tv-pairing.test.js
      - run: |
          bash -n samsung/package-dev.sh
          bash -n samsung/install-dev.sh
          python3 samsung/export-project.py dist/DichGame-Samsung-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DichGame-Samsung-unsigned-source
          path: dist/DichGame-Samsung-source.zip
          if-no-files-found: error
      - run: |
          python3 - <<'PY'
          import json, pathlib, re, xml.etree.ElementTree as ET
          ET.parse('samsung/config.xml')
          app = json.loads(pathlib.Path('webos/appinfo.json').read_text())
          assert pathlib.Path('webos', app['main']).is_file()
          script = re.search(r'<script>(.*?)</script>', pathlib.Path('webos/index.html').read_text(), re.S)
          assert script
          pathlib.Path('/tmp/webos-receiver.js').write_text(script.group(1))
          PY
          node --check /tmp/webos-receiver.js
