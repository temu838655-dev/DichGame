name: Build APK

# Chạy mỗi khi đẩy code lên, mở Pull Request, hoặc bấm tay ở tab Actions.
# Mỗi lần phát hành chỉ có 2 file APK: DichGame.apk (điện thoại) và DichGame-TV.apk (TV).
# Đẩy lên nhánh main/master hoặc gắn tag v* thì tự tạo bản phát hành (Releases) và dọn bớt bản dựng cũ.
on:
  push:
    branches: ["**", "!ci-shots"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 40   # đủ để lấy lời nhắn các commit của lần đẩy này làm ghi chú bản phát hành

      - name: Chuẩn bị khóa ký
        env:
          PUBLISH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) }}
          KEYSTORE_BASE64: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) && secrets.KEYSTORE_BASE64 || '' }}
          KEYSTORE_PASSWORD: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) && secrets.KEYSTORE_PASSWORD || '' }}
          KEY_ALIAS: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) && secrets.KEY_ALIAS || '' }}
          KEY_PASSWORD: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) && secrets.KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          umask 077
          path="$RUNNER_TEMP/android-signing.jks"
          if [[ "$PUBLISH" == true ]]; then
            : "${KEYSTORE_BASE64:?Thiếu KEYSTORE_BASE64}" "${KEYSTORE_PASSWORD:?Thiếu KEYSTORE_PASSWORD}" "${KEY_ALIAS:?Thiếu KEY_ALIAS}" "${KEY_PASSWORD:?Thiếu KEY_PASSWORD}"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$path"
          else
            KEY_ALIAS=ci
            KEYSTORE_PASSWORD=$(openssl rand -hex 24)
            KEY_PASSWORD=$KEYSTORE_PASSWORD
            keytool -genkeypair -keystore "$path" -alias "$KEY_ALIAS" -storepass:env KEYSTORE_PASSWORD -keypass:env KEY_PASSWORD -keyalg RSA -keysize 2048 -validity 7 -dname CN=Preview
          fi
          fingerprint=$(keytool -exportcert -keystore "$path" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" | sha256sum | cut -d' ' -f1)
          if [[ "$fingerprint" == 33eae1abcd6414312b96e9f6af7b34e3cd7e4893b36c1159e1ed7c1fd1537fcb ]]; then
            echo "::error::Khóa này đã công khai trong lịch sử Git."
            exit 1
          fi
          {
            echo "KEYSTORE_FILE=$path"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
            echo "SIGNER_SHA256=$fingerprint"
          } >> "$GITHUB_ENV"

      # Engine Remote Play (chiaki-ng) nằm trong third_party/chiaki-ng. Chỉ lấy đúng các thư viện con cần dùng, không lấy cả repo.
      - name: Lấy engine Remote Play (chiaki-ng)
        run: |
          git submodule update --init --depth 1 third_party/chiaki-ng
          cd third_party/chiaki-ng
          git submodule update --init --depth 1 third-party/nanopb third-party/jerasure third-party/gf-complete third-party/curl

      # Nối PCM đã giải mã từ Chiaki sang callback Kotlin để đưa vào hàng đợi ASR.
      - name: Áp dụng cầu nối âm thanh PCM cho Chiaki
        run: python3 tools/patch-chiaki-audio-pcm.py

      # Sửa lỗi treo cứng bộ giải mã hình khi surface bị huỷ (xoay màn hình, tắt màn hình).
      - name: Vá bộ giải mã hình của Chiaki (treo khi xoay màn hình)
        run: python3 tools/patch-chiaki-video-decoder.py

      # Công cụ để sinh mã giao thức (nanopb cần protoc và gói Python protobuf).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cài protoc và gói Python protobuf
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler
          python -m pip install "protobuf>=4,<6"
          protoc --version

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Android NDK đôi lúc được SDK Manager tải thành tệp ZIP hỏng trên runner GitHub.
      # Chuẩn bị NDK trước khi chạy Gradle, thử lại thay vì làm hỏng cả bản phát hành.
      - name: Cài NDK Android (thử lại khi tải lỗi)
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          for attempt in 1 2 3; do
            if "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "ndk;28.2.13676358"; then
              if [ -f "$ANDROID_HOME/ndk/28.2.13676358/source.properties" ]; then
                echo "Android NDK 28.2 đã sẵn sàng."
                break
              fi
            fi
            echo "::warning::NDK tải lỗi (lần $attempt/3); đang thử lại."
            rm -rf "$ANDROID_HOME/ndk/28.2.13676358"
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Không tải được Android NDK sau 3 lần thử."
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Đóng gói LG receiver vào APK
        run: |
          npm install -g @webos-tools/cli
          bash webos/package-dev.sh
          mkdir -p app/src/main/assets/tv
          packages=(webos/dist/*.ipk)
          test "${#packages[@]}" -eq 1
          test -s "${packages[0]}"
          cp "${packages[0]}" app/src/main/assets/tv/dichgame-lg.ipk
          python3 samsung/export-project.py app/src/main/assets/tv/DichGame-Samsung-source.zip

      - name: Chạy unit test (gói Việt hoá, nhận dạng âm thanh, hợp nhất phụ đề)
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build TV receiver và nhúng bộ cài vào điện thoại
        run: |
          gradle :tv:assembleRelease -PbuildNo=${{ github.run_number }} --no-daemon --stacktrace
          mkdir -p app/src/main/assets/tv
          test -s tv/build/outputs/apk/release/tv-release.apk
          cp tv/build/outputs/apk/release/tv-release.apk app/src/main/assets/tv/DichGame-TV.apk

      - name: Build điện thoại
        run: gradle :app:assembleRelease -PbuildNo=${{ github.run_number }} --no-daemon --stacktrace

      - name: Gom file APK
        run: |
          mkdir -p dist
          ls -la app/build/outputs/apk/release
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk dist/DichGame.apk
          cp tv/build/outputs/apk/release/tv-release.apk dist/DichGame-TV.apk
          ls -la dist
          {
            echo "### File APK"
            echo
            echo "| File | Dung lượng |"
            echo "| --- | --- |"
            for f in dist/*.apk; do echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Xác minh chữ ký của hai APK
        run: |
          set -euo pipefail
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          for apk in dist/*.apk; do
            "$signer" verify --print-certs "$apk" > "$RUNNER_TEMP/apk-cert.txt"
            cat "$RUNNER_TEMP/apk-cert.txt"
            actual=$(awk -F ': ' '/^Signer .*certificate SHA-256 digest: / { print tolower($NF) }' "$RUNNER_TEMP/apk-cert.txt" | tr -d ':' | sort -u)
            if [[ "$actual" != "$SIGNER_SHA256" ]]; then
              echo "::error file=$apk::Chứng chỉ APK không trùng chứng chỉ đã cấu hình."
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: DichGame-APKs
          path: dist/*.apk
          if-no-files-found: error

      # Ghi chú "Có gì mới" hiện trong app khi có bản cập nhật: lấy từ lời nhắn commit của lần đẩy này, bỏ các dòng ký tên tự động.
      # Một commit thì lấy cả lời nhắn; nhiều commit thì liệt kê dòng đầu của từng commit.
      - name: Soạn ghi chú bản phát hành
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          n=$(git rev-list --count "$BEFORE..$GITHUB_SHA" 2>/dev/null || echo 0)
          if [ "$n" -gt 1 ]; then
            git log --no-merges --format='• %s' "$BEFORE..$GITHUB_SHA" | head -12 > "$RUNNER_TEMP/notes.md"
          else
            git log -1 --format=%B "$GITHUB_SHA" | grep -v -E '^(Co-Authored-By|Claude-Session):' > "$RUNNER_TEMP/notes.md" || true
          fi
          echo "--- ($n commit) ghi chú:"; cat "$RUNNER_TEMP/notes.md"

      # Tag của bản phát hành luôn có dạng build-<số lần chạy> (cũng là số bản dựng ghi trong app) để app biết bản nào mới hơn;
      # app cũ tự đối chiếu số này rồi báo cập nhật ngay trong app. Bản gắn tag v* thì số nằm ở tên "Bản dựng <số> · v...".
      - name: Tạo bản phát hành (Releases)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}"
          name: "${{ startsWith(github.ref, 'refs/tags/') && format('Bản dựng {0} · {1}', github.run_number, github.ref_name) || format('Bản dựng {0}', github.run_number) }}"
          target_commitish: "${{ github.sha }}"
          prerelease: false
          make_latest: true
          generate_release_notes: false
          body_path: "${{ runner.temp }}/notes.md"
          files: dist/*.apk

      # Chỉ giữ 2 bản dựng mới nhất (bản mới và bản trước đó để quay lại khi cần), xóa các bản build-N cũ hơn.
      - name: Dọn bản dựng cũ
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 300 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | test("^build-[0-9]+$"))] | sort_by(.createdAt) | reverse | .[2:] | .[].tagName' |
          while read -r t; do
            [ -n "$t" ] && gh release delete "$t" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          done
