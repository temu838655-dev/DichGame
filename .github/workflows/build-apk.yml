name: Build APK

# Chạy mỗi khi đẩy code lên, mở Pull Request, hoặc bấm tay ở tab Actions.
# Tạo ra 4 file APK: điện thoại (release + debug) và TV (release + debug).
# Đẩy lên nhánh main/master hoặc gắn tag v* thì tự tạo bản phát hành (Releases) kèm 4 file APK để tải thẳng.
on:
  push:
    branches: ["**", "!ci-shots"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # Nếu đã tạo secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD thì ký bằng khóa riêng của bạn,
      # không thì dùng khóa mặc định trong thư mục keystore/.
      - name: Dùng khóa ký riêng (nếu có)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "Đang ký bằng khóa riêng."
          else
            echo "Đang ký bằng khóa mặc định trong keystore/."
          fi

      - name: Build điện thoại và TV
        run: gradle :app:assembleDebug :app:assembleRelease :tv:assembleDebug :tv:assembleRelease -PbuildNo=${{ github.run_number }} --no-daemon --stacktrace

      - name: Gom file APK
        run: |
          mkdir -p dist
          ls -la app/build/outputs/apk/release app/build/outputs/apk/debug
          cp app/build/outputs/apk/release/app-universal-release.apk dist/DichGame-phone-release.apk
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk dist/DichGame-phone-arm64-release.apk
          cp app/build/outputs/apk/debug/app-universal-debug.apk dist/DichGame-phone-debug.apk
          cp tv/build/outputs/apk/release/tv-release.apk dist/DichGame-TV-release.apk
          cp tv/build/outputs/apk/debug/tv-debug.apk dist/DichGame-TV-debug.apk
          ls -la dist
          {
            echo "### File APK"
            echo
            echo "| File | Dung lượng |"
            echo "| --- | --- |"
            for f in dist/*.apk; do echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: DichGame-APKs
          path: dist/*.apk
          if-no-files-found: error

      - name: Tạo bản phát hành (Releases)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}"
          name: "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Bản dựng {0}', github.run_number) }}"
          target_commitish: "${{ github.sha }}"
          prerelease: "${{ !startsWith(github.ref, 'refs/tags/') }}"
          generate_release_notes: true
          files: dist/*.apk
