name: Build APK

# Chạy mỗi khi đẩy code lên, mở Pull Request, hoặc bấm tay ở tab Actions.
# Mỗi lần phát hành chỉ có 2 file APK: DichGame.apk (điện thoại) và DichGame-TV.apk (TV).
# Đẩy lên nhánh main/master hoặc gắn tag v* thì tự tạo bản phát hành (Releases) và dọn bớt bản dựng cũ.
on:
  push:
    branches: ["**", "!ci-shots"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 40   # đủ để lấy lời nhắn các commit của lần đẩy này làm ghi chú bản phát hành

      # Engine Remote Play (chiaki-ng) nằm trong third_party/chiaki-ng. Chỉ lấy đúng các thư viện con cần dùng, không lấy cả repo.
      - name: Lấy engine Remote Play (chiaki-ng)
        run: |
          git submodule update --init --depth 1 third_party/chiaki-ng
          cd third_party/chiaki-ng
          git submodule update --init --depth 1 third-party/nanopb third-party/jerasure third-party/gf-complete third-party/curl

      # Nối PCM đã giải mã từ Chiaki sang callback Kotlin để đưa vào hàng đợi ASR.
      - name: Áp dụng cầu nối âm thanh PCM cho Chiaki
        run: python3 tools/patch-chiaki-audio-pcm.py

      # Sửa lỗi treo cứng bộ giải mã hình khi surface bị huỷ (xoay màn hình, tắt màn hình).
      - name: Vá bộ giải mã hình của Chiaki (treo khi xoay màn hình)
        run: python3 tools/patch-chiaki-video-decoder.py

      # Công cụ để sinh mã giao thức (nanopb cần protoc và gói Python protobuf).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cài protoc và gói Python protobuf
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler
          python -m pip install "protobuf>=4,<6"
          protoc --version
      - name: Kiểm thử quy tắc tương thích cập nhật Release
        run: python3 -m unittest discover -s ci -p 'test_release_compat.py' -v

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # Người vận hành đã chấp thuận tạm bỏ qua việc xoay khóa ký để phát hành bản cập nhật.
      # Nếu thiếu GitHub Secrets, dùng keystore hiện có trong repo; bước xác minh phía dưới
      # bắt buộc chứng thư SHA-256 và versionCode khớp Release trước, nếu không sẽ dừng phát hành.
      # Khóa hiện tại đã từng xuất hiện trong lịch sử repo công khai: cần xoay khóa sau đợt chuyển tiếp.
      - name: Kiểm tra và nạp khóa ký
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          IS_PUBLIC_RELEASE: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64}${KEYSTORE_PASSWORD}${KEY_ALIAS}${KEY_PASSWORD}" ]; then
            for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
              if [ -z "${!name}" ]; then
                echo "::error::Bộ khóa riêng chưa đầy đủ ($name đang trống)."
                exit 1
              fi
            done
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            test -s "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "CAN_PUBLISH_RELEASE=true" >> "$GITHUB_ENV"
            echo "Đang ký bằng khóa trong GitHub Secrets; kiểm tra tương thích chứng thư sẽ quyết định có phát hành được hay không."
          else
            test -s keystore/dichgame.jks
            if [ "$IS_PUBLIC_RELEASE" = "true" ]; then
              echo "::warning::Đang dùng khóa ký hiện có trong repo theo yêu cầu phát hành; khóa này đã lộ trong lịch sử repo công khai."
              echo "CAN_PUBLISH_RELEASE=true" >> "$GITHUB_ENV"
              echo "### Phát hành bằng khóa ký hiện có" >> "$GITHUB_STEP_SUMMARY"
              echo "Đã bỏ qua yêu cầu secrets theo chấp thuận của chủ dự án. Release chỉ tiếp tục nếu chứng thư và versionCode khớp bản trước." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "CAN_PUBLISH_RELEASE=false" >> "$GITHUB_ENV"
            fi
            echo "Dùng keystore hiện có; mọi public release vẫn phải qua bước đối chiếu chứng thư/versionCode."
          fi

      # Android NDK đôi lúc được SDK Manager tải thành tệp ZIP hỏng trên runner GitHub.
      # Chuẩn bị NDK trước khi chạy Gradle, thử lại thay vì làm hỏng cả bản phát hành.
      - name: Cài NDK Android (thử lại khi tải lỗi)
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          for attempt in 1 2 3; do
            if "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "ndk;28.2.13676358"; then
              if [ -f "$ANDROID_HOME/ndk/28.2.13676358/source.properties" ]; then
                echo "Android NDK 28.2 đã sẵn sàng."
                break
              fi
            fi
            echo "::warning::NDK tải lỗi (lần $attempt/3); đang thử lại."
            rm -rf "$ANDROID_HOME/ndk/28.2.13676358"
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Không tải được Android NDK sau 3 lần thử."
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Đóng gói LG receiver vào APK
        run: |
          npm install -g @webos-tools/cli
          bash webos/package-dev.sh
          mkdir -p app/src/main/assets/tv
          packages=(webos/dist/*.ipk)
          test "${#packages[@]}" -eq 1
          test -s "${packages[0]}"
          cp "${packages[0]}" app/src/main/assets/tv/dichgame-lg.ipk
          python3 samsung/export-project.py app/src/main/assets/tv/DichGame-Samsung-source.zip

      - name: Chạy unit test (gói Việt hoá, nhận dạng âm thanh, hợp nhất phụ đề)
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build TV receiver và nhúng bộ cài vào điện thoại
        run: |
          gradle :tv:assembleRelease -PbuildNo=${{ github.run_number }} --no-daemon --stacktrace
          mkdir -p app/src/main/assets/tv
          test -s tv/build/outputs/apk/release/tv-release.apk
          cp tv/build/outputs/apk/release/tv-release.apk app/src/main/assets/tv/DichGame-TV.apk

      - name: Build điện thoại
        run: gradle :app:assembleRelease -PbuildNo=${{ github.run_number }} --no-daemon --stacktrace

      - name: Gom file APK
        run: |
          mkdir -p dist
          ls -la app/build/outputs/apk/release
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk dist/DichGame.apk
          cp tv/build/outputs/apk/release/tv-release.apk dist/DichGame-TV.apk
          ls -la dist
          {
            echo "### File APK"
            echo
            echo "| File | Dung lượng |"
            echo "| --- | --- |"
            for f in dist/*.apk; do echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"; done
          } >> "$GITHUB_STEP_SUMMARY"

      # Kiểm tra trước khi đóng gói: APK hợp lệ, đúng package và cùng chứng thư ký.
      - name: Xác minh chữ ký và định dạng hai APK
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PUBLIC_RELEASE: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) }}
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          AAPT="$BUILD_TOOLS/aapt"
          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"
          test -x "$AAPT"
          for apk in dist/DichGame.apk dist/DichGame-TV.apk; do
            test -s "$apk"
            "$APKSIGNER" verify --verbose "$apk"
            "$ZIPALIGN" -c -v 4 "$apk"
          done
          PHONE_PACKAGE="$("$AAPT" dump badging dist/DichGame.apk | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n1)"
          TV_PACKAGE="$("$AAPT" dump badging dist/DichGame-TV.apk | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n1)"
          test "$PHONE_PACKAGE" = "com.dichgame.app"
          test "$TV_PACKAGE" = "com.dichgame.tv"
          PHONE_CERT="$("$APKSIGNER" verify --print-certs dist/DichGame.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -n1)"
          TV_CERT="$("$APKSIGNER" verify --print-certs dist/DichGame-TV.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -n1)"
          test -n "$PHONE_CERT"
          test "$PHONE_CERT" = "$TV_CERT"
          PHONE_VERSION_CODE="$("$AAPT" dump badging dist/DichGame.apk | sed -n "s/^package:.*versionCode='\([0-9][0-9]*\)'.*/\1/p" | head -n1)"
          TV_VERSION_CODE="$("$AAPT" dump badging dist/DichGame-TV.apk | sed -n "s/^package:.*versionCode='\([0-9][0-9]*\)'.*/\1/p" | head -n1)"
          test -n "$PHONE_VERSION_CODE"
          test -n "$TV_VERSION_CODE"
          echo "Package điện thoại: $PHONE_PACKAGE (versionCode=$PHONE_VERSION_CODE)"
          echo "Package Android TV: $TV_PACKAGE (versionCode=$TV_VERSION_CODE)"
          echo "Hai APK hợp lệ, cùng chứng thư ký SHA-256: $PHONE_CERT" >> "$GITHUB_STEP_SUMMARY"
          if [ "$IS_PUBLIC_RELEASE" = "true" ]; then
            # Chọn build-N lớn nhất theo số, không phụ thuộc thứ tự thời gian trả về từ GitHub.
            LATEST_TAG="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName \
              --jq '[.[].tagName | select(test("^build-[0-9]+$"))] | sort_by(sub("^build-"; "") | tonumber) | last // empty')"
            if [ -n "$LATEST_TAG" ]; then
              PREVIOUS_BUILD_NO="${LATEST_TAG#build-}"
              if [ "$GITHUB_RUN_NUMBER" -le "$PREVIOUS_BUILD_NO" ]; then
                echo "::error::Số bản dựng mới ($GITHUB_RUN_NUMBER) không cao hơn Release hiện tại ($LATEST_TAG). Dừng phát hành."
                exit 1
              fi
              mkdir -p "$RUNNER_TEMP/previous-release"
              gh release download "$LATEST_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'DichGame*.apk' \
                --dir "$RUNNER_TEMP/previous-release"
              PREVIOUS_PHONE="$RUNNER_TEMP/previous-release/DichGame.apk"
              PREVIOUS_TV="$RUNNER_TEMP/previous-release/DichGame-TV.apk"
              test -s "$PREVIOUS_PHONE"
              test -s "$PREVIOUS_TV"
              PREVIOUS_PHONE_CERT="$("$APKSIGNER" verify --print-certs "$PREVIOUS_PHONE" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n1)"
              PREVIOUS_TV_CERT="$("$APKSIGNER" verify --print-certs "$PREVIOUS_TV" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n1)"
              test -n "$PREVIOUS_PHONE_CERT"
              test -n "$PREVIOUS_TV_CERT"
              if [ "$PREVIOUS_PHONE_CERT" != "$PREVIOUS_TV_CERT" ]; then
                echo "::error::Hai APK của Release cũ $LATEST_TAG không cùng chứng thư ký. Cần kiểm tra thủ công trước khi phát hành."
                exit 1
              fi
              if [ "$PHONE_CERT" != "$PREVIOUS_PHONE_CERT" ] || [ "$TV_CERT" != "$PREVIOUS_TV_CERT" ]; then
                echo "::error::Chứng thư APK mới khác Release $LATEST_TAG (điện thoại hoặc TV). Dừng phát hành để tránh làm người dùng không thể cập nhật."
                exit 1
              fi
              PREVIOUS_PHONE_VERSION="$("$AAPT" dump badging "$PREVIOUS_PHONE" | sed -n "s/^package:.*versionCode='\([0-9][0-9]*\)'.*/\1/p" | head -n1)"
              PREVIOUS_TV_VERSION="$("$AAPT" dump badging "$PREVIOUS_TV" | sed -n "s/^package:.*versionCode='\([0-9][0-9]*\)'.*/\1/p" | head -n1)"
              test -n "$PREVIOUS_PHONE_VERSION"
              test -n "$PREVIOUS_TV_VERSION"
              python3 ci/release_compat.py \
                --previous-build "$PREVIOUS_BUILD_NO" \
                --current-build "$GITHUB_RUN_NUMBER" \
                --previous-phone "$PREVIOUS_PHONE_VERSION" \
                --previous-tv "$PREVIOUS_TV_VERSION" \
                --current-phone "$PHONE_VERSION_CODE" \
                --current-tv "$TV_VERSION_CODE"
              {
                echo "Đối chiếu Release trước: $LATEST_TAG"
                echo "versionCode điện thoại: $PREVIOUS_PHONE_VERSION → $PHONE_VERSION_CODE (đúng delta build)"
                echo "versionCode Android TV: $PREVIOUS_TV_VERSION → $TV_VERSION_CODE (đúng delta build)"
                echo "Chứng thư ký SHA-256 không đổi cho cả hai APK."
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::Chưa có bản build-* trước đó để đối chiếu chứng thư/versionCode."
            fi
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: DichGame-APKs
          path: dist/*.apk
          if-no-files-found: error

      # Ghi chú "Có gì mới" hiện trong app khi có bản cập nhật: lấy từ lời nhắn commit của lần đẩy này, bỏ các dòng ký tên tự động.
      # Một commit thì lấy cả lời nhắn; nhiều commit thì liệt kê dòng đầu của từng commit.
      - name: Soạn ghi chú bản phát hành
        if: env.CAN_PUBLISH_RELEASE == 'true'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          n=$(git rev-list --count "$BEFORE..$GITHUB_SHA" 2>/dev/null || echo 0)
          if [ "$n" -gt 1 ]; then
            git log --no-merges --format='• %s' "$BEFORE..$GITHUB_SHA" | head -12 > "$RUNNER_TEMP/notes.md"
          else
            git log -1 --format=%B "$GITHUB_SHA" | grep -v -E '^(Co-Authored-By|Claude-Session):' > "$RUNNER_TEMP/notes.md" || true
          fi
          echo "--- ($n commit) ghi chú:"; cat "$RUNNER_TEMP/notes.md"

      # Tag của bản phát hành luôn có dạng build-<số lần chạy> (cũng là số bản dựng ghi trong app) để app biết bản nào mới hơn;
      # app cũ tự đối chiếu số này rồi báo cập nhật ngay trong app. Bản gắn tag v* thì số nằm ở tên "Bản dựng <số> · v...".
      - name: Tạo bản phát hành (Releases)
        if: env.CAN_PUBLISH_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}"
          name: "${{ startsWith(github.ref, 'refs/tags/') && format('Bản dựng {0} · {1}', github.run_number, github.ref_name) || format('Bản dựng {0}', github.run_number) }}"
          target_commitish: "${{ github.sha }}"
          prerelease: false
          make_latest: true
          generate_release_notes: false
          body_path: "${{ runner.temp }}/notes.md"
          files: dist/*.apk

      # Preserve every historical build-N Release; never delete older APK releases.
