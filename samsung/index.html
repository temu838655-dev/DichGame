<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;background:transparent;color:white;font:26px Arial}#panel{position:absolute;top:24px;left:24px;background:#151515;padding:24px;border-radius:12px}button,input,select{font:inherit;margin:6px;padding:10px}#sub{position:absolute;bottom:7%;left:5%;right:5%;text-align:center;font-size:42px;pointer-events:none}#text{background:rgba(0,0,0,.75);white-space:pre-wrap}#text:empty{display:none}</style></head><body><div id="panel"><h2>DichGame TV</h2><div id="sources"></div><input id="host" placeholder="IP điện thoại:8780"><button id="connect">Nhận phụ đề</button><div><label>Cỡ chữ <select id="size"><option>30</option><option selected>42</option><option>54</option><option>66</option></select></label><label>Vị trí <select id="position"><option value="bottom">Dưới</option><option value="top">Trên</option></select></label></div><div><label>Màu chữ <select id="color"><option value="#ffffff">Trắng</option><option value="#ffff00">Vàng</option><option value="#00ffff">Xanh</option></select></label><label>Nền <select id="background"><option value="0.75">Đậm</option><option value="0.4">Mờ</option><option value="0">Không nền</option></select></label><button id="hide">Ẩn bảng</button></div><p id="status" role="status">Chọn HDMI đang phát.</p></div><div id="sub"><span id="text"></span></div><script src="pairing.js"></script><script src="receiver.js"></script></body></html>
