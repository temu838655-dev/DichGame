name: DichGameiOS
options:
  bundleIdPrefix: com.dichgame
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.19
targets:
  DichGameiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DichGameiOS
    dependencies:
      - package: ZIPFoundation
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: DichGame
        NSLocalNetworkUsageDescription: DichGame kết nối TV trong mạng nội bộ để gửi phụ đề.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dichgame.ios
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "DichGame kết nối TV trong mạng nội bộ để gửi phụ đề."
        INFOPLIST_KEY_CFBundleDisplayName: "DichGame"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        SUPPORTS_MACCATALYST: NO
